  <script>
    // 1. Pure Special-Character Decryption Engine (No Alphas, All Body Text Including Timestamps)
    const SPECIAL_CHARS = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`§±×÷Δ∑ΞΛΠΩψχφλ';

    function getRandomSpecial() {
      return SPECIAL_CHARS[Math.floor(Math.random() * SPECIAL_CHARS.length)];
    }

    function scrambleWithSpecials(text) {
      return text.split('').map(char => {
        return /\s/.test(char) ? char : getRandomSpecial();
      }).join('');
    }

    // Collect ALL text nodes across #js-app (including timestamps, telemetry, labels, links)
    const textItems = [];
    const appEl = document.getElementById('js-app');

    if (appEl) {
      const walker = document.createTreeWalker(
        appEl,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: (node) => {
            const parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            const tag = parent.tagName.toLowerCase();
            if (tag === 'script' || tag === 'style' || tag === 'svg' || tag === 'path') {
              return NodeFilter.FILTER_REJECT;
            }
            if (parent.closest('svg')) return NodeFilter.FILTER_REJECT;
            if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      let curr;
      while ((curr = walker.nextNode())) {
        const orig = curr.nodeValue;
        curr.nodeValue = scrambleWithSpecials(orig);
        textItems.push({ node: curr, original: orig });
      }
    }

    function animateTextNode(item, duration = 2000) {
      const target = item.original;
      const start = performance.now();

      // Hold pure special characters for the first 1600ms (1.6s)
      // and resolve progressively between 1600ms and 2000ms
      const minChurn = duration * 0.8; // 1600ms
      const resolveTimes = target.split('').map((char, i) => {
        if (/\s/.test(char)) return 0;
        const progress = (i + 1) / target.length;
        const base = minChurn + progress * (duration - minChurn);
        const jitter = (Math.random() - 0.5) * (duration * 0.05);
        return Math.min(Math.max(base + jitter, minChurn), duration);
      });

      function render(elapsed) {
        let allResolved = true;
        let rendered = '';

        for (let i = 0; i < target.length; i++) {
          const origChar = target[i];
          if (/\s/.test(origChar)) {
            rendered += origChar;
            continue;
          }

          if (elapsed < resolveTimes[i]) {
            allResolved = false;
            rendered += getRandomSpecial();
          } else {
            rendered += origChar; // Permanently locked to real character
          }
        }

        item.node.nodeValue = rendered;
        return allResolved;
      }

      // Synchronously render frame 0 with pure special characters immediately
      render(0);

      const timer = setInterval(() => {
        const elapsed = performance.now() - start;
        const allResolved = render(elapsed);

        if (elapsed >= duration || allResolved) {
          clearInterval(timer);
          item.node.nodeValue = target;
        }
      }, 25);
    }

    // 2. Page Reveal & Initialization Sequence (Runs Strictly Once On Loading)
    let hasRevealed = false;
    function revealPage() {
      if (hasRevealed) return;
      hasRevealed = true;
      // Animate ALL text items at once synchronously before visibility
      textItems.forEach(item => animateTextNode(item, 2000));
      document.body.style.visibility = 'visible';
      document.body.style.opacity = '1';
    }

    Promise.all([
      document.fonts ? document.fonts.ready : Promise.resolve(),
      new Promise(resolve => {
        if (document.readyState === 'complete') {
          resolve();
        } else {
          window.addEventListener('load', resolve);
        }
      })
    ]).then(revealPage);

    // Safety timeout fallback
    setTimeout(revealPage, 1000);

    // 3. Email Card Click & Copy Feedback
    const emailCard = document.getElementById('email-card');
    if (emailCard) {
      let copyTimer = null;
      emailCard.addEventListener('click', () => {
        const email = 'jqxzw@protonmail.com';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).catch(() => {});
        } else {
          try {
            const ta = document.createElement('textarea');
            ta.value = email;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          } catch(e) {}
        }
        const promptEl = document.getElementById('email-prompt');
        if (promptEl) {
          clearTimeout(copyTimer);
          const original = 'TRANSMIT';
          promptEl.textContent = 'COPIED // CLIPBOARD';
          copyTimer = setTimeout(() => { promptEl.textContent = original; }, 1800);
        }
      });
    }

    // 4. Disable Mobile Zoom & Selection Gestures
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());

    // Prevent multi-touch pinch zoom
    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Prevent double-tap zoom while preserving instant link clicks
    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = performance.now();
      if (now - lastTouch <= 300) {
        if (!e.target.closest('a, button')) {
          e.preventDefault();
        }
      }
      lastTouch = now;
    }, { passive: false });
  </script>
