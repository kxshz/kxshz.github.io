  <script>
    // Progressive enhancement: mark JS-enabled to gate font reveal

  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400 900;
      font-display: block;
      src: url('orbitron.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/kxshz/kxshz.github.io@main/orbitron.woff2') format('woff2');
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: 'Orbitron', monospace;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* By default (including NoScript): 100% visible immediately */
    body {
      opacity: 1;
      visibility: visible;
    }

    /* When JS is present: hold opacity until font is parsed & ready in memory */
    html.js body {
      opacity: 0;
      transition: opacity 0.12s ease-in;
    }

    html.js body.ready {
      opacity: 1;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      text-align: left;
      padding: max(2rem, env(safe-area-inset-top)) max(2rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(2rem, env(safe-area-inset-left));
    }

    main, .content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      gap: 0.25rem;
    }

    .spacer {

    a {

      text-decoration: none;
      cursor: pointer;
      display: inline-block;
    }

    a:hover {
      text-decoration: underline;
    }

    a:active {
      opacity: 0.7;
    }
  </style>

  <!-- Complete Deterministic NoScript Fallback -->
  <noscript>

        visibility: visible !important;
        background-color: #000000 !important;
        color: #ffffff !important;

      a:hover {

      }
    </style>
  </noscript>
</head>
<body>

  <script>
    // Smooth font reveal in JS environments: display only when font is fully parsed & ready in memory
    (function() {
      function show() {
        document.body.classList.add('ready');
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(show).catch(show);
        setTimeout(show, 400);
      } else {
        show();
      }
    })();

    // 1-Click Clipboard Copy Feedback for Email
    const emailLink = document.getElementById('email-link');
    if (emailLink) {
      let copyTimer = null;
      emailLink.addEventListener('click', () => {
        const email = 'jqxzw@protonmail.com';
        copyText(email);

        clearTimeout(copyTimer);
        emailLink.textContent = 'EMAIL (COPIED)';
        copyTimer = setTimeout(() => {
          emailLink.textContent = 'EMAIL (JQXZW)';
        }, 1500);
      });
    }

    function copyText(str) {
      if (navigator.clipboard && window.isSecureContext && typeof navigator.clipboard.writeText === 'function') {
        try {
          const p = navigator.clipboard.writeText(str);
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              fallbackCopy(str);
            });
          }
          return;
        } catch (_) {}
      }
      fallbackCopy(str);
    }

    function fallbackCopy(str) {
      const prevActive = document.activeElement;
      try {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        ta.style.userSelect = 'text';
        ta.style.webkitUserSelect = 'text';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, str.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) {
      } finally {
        if (prevActive && typeof prevActive.focus === 'function') {
          try { prevActive.focus(); } catch (_) {}
        }
      }
    }

    // Touch & Gesture Zoom Prevention
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => {
      const el = e.target instanceof Element ? e.target : (e.target && e.target.parentElement instanceof Element ? e.target.parentElement : null);
      if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) return;
      e.preventDefault();
    });

    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = performance.now();
      if (now - lastTouch <= 300) {
        const el = e.target instanceof Element ? e.target : (e.target && e.target.parentElement instanceof Element ? e.target.parentElement : null);
        if (!el || !el.closest('a')) {
          e.preventDefault();
        }
      }
      lastTouch = now;
    }, { passive: false });
  </script>
</body>
